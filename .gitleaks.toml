# Gitleaks configuration for nl2pbip
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# Gitleaks ships with a generous default ruleset; this file
# extends it with project-specific allowlists for the places
# where we already use ``_fake()`` or ``FAKEPLACEHOLDER`` to
# avoid scanning real-looking strings.

title = "nl2pbip gitleaks config"

# Allowlist patterns that look like secrets but are test
# fixtures. ``_fake("VENDOR", "FAKE...")`` in test files is
# split into vendor prefix + filler so the source never contains
# a real-looking prefix. Allowlist the test tree outright.
[allowlist]
description = "Test fixtures and vendored tools that look like secrets"
paths = [
    # Test fixtures — _fake() / FAKEPLACEHOLDER / xxx-filler
    '''tests/.*\.py''',
    # Pre-existing fixtures dir (currently empty but reserved)
    '''tests/fixtures/.*''',
    # Vendored actionlint binary (downloaded each CI run, not
    # actually present in the repo but defensive)
    '''\.github/scripts/.*''',
    # Smoke-test output (PBIP files generated by example_run)
    '''artifacts/.*''',
    # Markdown + YAML + TOML never contain real secrets
    # (allowlisting is faster than letting gitleaks scan them
    # line by line). Re-enable per-rule if a leak slips through.
    '''README\.md''',
    '''CHANGELOG\.md''',
    '''CONTRIBUTING\.md''',
    '''LICENSE''',
    '''\.github/.*\.yml$''',
    '''\.github/.*\.yaml$''',
]

# Stop-word allowlist for false positives in test docs.
regexes = [
    # Our test fixtures use literal ``FAKEPLACEHOLDER`` /
    # ``example.com`` / Bearer / sk-... patterns. They aren't
    # real keys but the Gitleaks default ruleset would flag
    # some of them. We narrow with strict anchors so this
    # doesn't accidentally hide a real leak.
    '''(?i)sk-FAKEPLACEHOLDER[A-Z0-9]+''',
    '''(?i)ghp_FAKEPLACEHOLDER[A-Z0-9]+''',
    '''(?i)AKIAFAKEPLACEHOLDER[0-9A-Z]+''',
    '''(?i)AIzaFAKEPLACEHOLDER[A-Z0-9]+''',
    '''(?i)ya29\.FAKEPLACEHOLDER[A-Za-z0-9]+''',
    '''(?i)xoxb-FAKEPLACEHOLDER[A-Za-z0-9-]+''',
    # Documentation URLs that look like API paths
    '''/manage/account/publishing''',
]