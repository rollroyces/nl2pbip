name: "PR labeler"

# Auto-apply labels to PRs based on the files they touch.
# Uses actions/labeler v5 with a .github/labeler.yml config.
# Triggered only on pull_request_target (read-mostly tokens
# need write access to apply labels — set via GITHUB_TOKEN
# default permissions).
#
# If a maintainer wants to add a new label rule, edit
# .github/labeler.yml and add a matching label in the repo
# settings — the regression tests in tests/test_repo_templates.py
# ensure the config is valid YAML and that every label
# referenced there exists in the labels manifest.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # pull_request_target gives us write access to the
      # repo's PR labels, but it checks out the BASE branch
      # by default — so the labeler would read main's
      # .github/labeler.yml instead of the PR head's.
      # Explicitly check out the head SHA so a labeler.yml
      # change on the PR can land without a separate fix to
      # main first.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml