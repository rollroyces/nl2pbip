name: "mypy --strict"

# Type-check the nl2pbip package with mypy --strict.
#
# This is a REPORT-ONLY workflow (not a CI gate) because the
# codebase has accumulated ~77 mypy-strict errors since the
# v1.0.0 audit (mostly bare ``set`` / ``dict`` generics + a few
# missing return-type annotations). The plan is:
#
#   1. Land this workflow now so we see the trend every PR.
#   2. Fix the strict errors in batches over the next few
#      releases (track in CHANGELOG).
#   3. Promote this to ``permissions: read`` + a separate
#      ``gating`` job that fails the PR once the count is 0.
#
# Runs against nl2pbip/ (excludes nl2pbip/finetune and
# nl2pbip/providers, which are type-excluded by design
# because their ML dependencies don't ship py.typed
# markers — see [tool.mypy.overrides] in pyproject.toml).

on:
  pull_request:
    branches: [main, master]
    paths:
      - "nl2pbip/**/*.py"
      - ".github/workflows/mypy.yml"
      - "pyproject.toml"
  push:
    branches: [main, master]
    paths:
      - "nl2pbip/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/mypy.yml"

permissions:
  contents: read

jobs:
  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gating: exits non-zero when mypy --strict reports any
    # error. The codebase was promoted from report-only to
    # gating once the long-tail error count reached 0.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install nl2pbip + mypy + type stubs
        # Mypy strict mode requires type stubs for untyped third-party
        # libs. We install the ones nl2pbip actually imports.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # ``mypy`` and the type stubs are pinned in the
          # ``[dev]`` extra (pyproject.toml); install them
          # again here so the CI install is explicit.
          python -m pip install \
              mypy \
              types-jsonschema \
              types-PyYAML \
              types-requests \
              types-tabulate

      - name: Run mypy --strict
        # The error count is the headline metric. We surface it
        # via ``$GITHUB_STEP_SUMMARY`` so the workflow run page
        # shows the trend without scrolling through logs. The
        # command exits non-zero on any error — gating since
        # the codebase hit 0 errors.
        # Note: ``bash -e`` (errexit) is on. The ``|| true``
        # on the command substitution swallows mypy's
        # non-zero exit so we can capture the count + log
        # before re-raising it at the end.
        run: |
          set +e
          OUTPUT=$(mypy --strict --no-incremental --show-error-count nl2pbip 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT" | tee mypy.log
          COUNT=$(echo "$OUTPUT" | grep -oE '[0-9]+ errors?' | head -1 | grep -oE '[0-9]+' || echo "?")
          {
              echo "## mypy --strict"
              echo ""
              echo "**Errors:** $COUNT"
              echo ""
              echo "Full output: see \`mypy-strict-log\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: Upload mypy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-strict-log
          path: mypy.log
          retention-days: 14