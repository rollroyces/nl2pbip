name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    env:
      OPENAI_API_KEY: "sk-ci-dummy-key"
      DEEPSEEK_API_KEY: "sk-ci-dummy-key"
      DASHSCOPE_API_KEY: "sk-ci-dummy-key"
      ZHIPU_API_KEY: "sk-ci-dummy-key"
      MOONSHOT_API_KEY: "sk-ci-dummy-key"
      AZURE_OPENAI_API_KEY: "sk-ci-dummy-key"
      AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi
          pip install pytest pytest-mock pytest-cov ruff black

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v --cov=. --cov-report=term-missing
