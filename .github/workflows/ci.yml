name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # manual trigger for the benchmarks job

# Cancel in-progress runs for the same branch / PR when a new
# commit lands — saves CI minutes on rapid-fire pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nl2pbip + [mcp]
        # Install [mcp] alongside [dev] so the MCP server
        # test file (tests/test_mcp_server.py) is actually
        # exercised. The extra is pure-optional for end
        # users — only CI needs it for the surface tests.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          pip-extras: "mcp"
          pip-packages: "vulture"

      - name: Verify the example runner produces a valid PBIP
        # Smoke test for the top-level entry point — runs the
        # bundled example and confirms the output directory
        # exists with the expected files.
        run: |
          python -m nl2pbip.example_run
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.pbip
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.SemanticModel/definition/model.tmdl
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.SemanticModel/itemMetadata.json
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.SemanticModel/.platform
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.Report/itemMetadata.json
          test -f artifacts/SalesInsights.pbipdir/SalesInsights.Report/.platform

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Dead-code check with Vulture
        # Vulture flags unused imports / functions / variables.
        # Confidence threshold 80% = report only findings with
        # strong evidence (e.g. clearly unused private
        # functions). Lower thresholds produce noise from
        # reflection / dynamic dispatch.
        run: |
          vulture nl2pbip --min-confidence 80

      - name: Run tests
        # Skip test_finetune.py because it requires the heavy
        # ``finetune`` extra (datasets, transformers, trl) which
        # isn't installed in CI. Run those tests locally with
        # ``pip install -e ".[finetune]"``.
        run: pytest -v --cov=nl2pbip --cov-report=term-missing --cov-report=xml --ignore=tests/test_finetune.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        # The token is optional — without it, Codecov falls back to
        # unauthenticated uploads (rate-limited).

  benchmarks:
    name: Performance benchmarks
    # Manual trigger only — benchmarks are opt-in to keep the
    # default CI run fast. Run from the Actions tab.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nl2pbip + [mcp]
        # Install [mcp] alongside [dev] so the MCP server
        # test file (tests/test_mcp_server.py) is actually
        # exercised. The extra is pure-optional for end
        # users — only CI needs it for the surface tests.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          pip-extras: "mcp"

      - name: Run benchmarks
        env:
          NL2PBIP_RUN_BENCHMARKS: "1"
        run: pytest tests/test_performance.py -v -s
