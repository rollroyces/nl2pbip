name: "License compliance check"

# License compliance gate. The project is commercial but ships
# the full dependency tree in the wheel metadata (every package +
# its license). ``pip-licenses`` walks the installed deps and
# fails the build if any of them are GPL/AGPL/SSPL/Commons-
# Clause — the licenses that the ``CONTRIBUTING.md`` rules
# explicitly forbid.
#
# We run this against the same dep set CI installs (``.[dev]``
# + the `[anthropic]` + `[finetune]` extras in the wider
# matrix). The ``--fail-on`` flag uses pip-licenses' default
# matching: case-insensitive, substring on the license name.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - ".github/workflows/license-check.yml"
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"

permissions:
  contents: read

jobs:
  license-check:
    name: pip-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install nl2pbip + all extras
        # The full dep set: runtime + dev + anthropic.
        # We want to catch any GPL that sneaks into any of these
        # surfaces, not just the runtime.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          pip-extras: "anthropic"
          pip-packages: "pip-tools"

      - name: pip-licenses --fail-on
        # ``--fail-on`` takes a comma-separated list. The regex
        # matches any package whose license name contains any of
        # the patterns. We forbid the four copyleft flavors
        # called out in CONTRIBUTING.md.
        #
        # Note: ``pip-licenses`` defaults to ``--from=mixed`` which
        # reports the package's own declared license. If a
        # package's license is "UNKNOWN" we surface that too —
        # unknowns should be reviewed manually.
        #
        # PROMOTED TO GATING (was soft-fail via ``exit 0``): the
        # current dep tree contains 0 UNKNOWN-licensed packages
        # (verified via ``pip-licenses --format=csv`` — 123 deps,
        # all resolve to a known license string). Any new dep
        # without a declared license will fail this step instead
        # of just emitting a warning. If a transitive UNKNOWN
        # re-appears (e.g. after a new release of a major lib),
        # either (a) pin an older release that ships a license
        # or (b) document it in CONTRIBUTING.md and switch to
        # ``--with-license-file`` to confirm a permissively-
        # licensed file is present, then re-promote.
        run: |
          set -e
          pip-licenses \
              --format=plain-vertical \
              --with-system \
              --fail-on='GPL,LGPL,AGPL,SSPL,Commons-Clause,UNKNOWN' \
              2>&1 | tee license-report.txt
          echo "pip-licenses exit: $?"
          echo "License check passed — no copyleft or UNKNOWN deps detected."

      - name: Hash-pin audit (--require-hashes style)
        # Builds a fully-pinned requirements file from
        # pyproject.toml + emits SHA-256 hashes for every wheel.
        # ``pip-compile`` is the canonical tool — installed via
        # the ``pip-tools`` PyPI package. If a transitive dep
        # yanked its wheel or changed its hash, this step fails
        # the build with a clear "hash mismatch" error, surfacing
        # the supply-chain break before any downstream job runs.
        #
        # The generated requirements.txt is uploaded as an
        # artifact so a maintainer can diff it against the
        # previous known-good lock to spot unexpected churn.
        #
        # Note: this is the ``--require-hashes``-style audit
        # mentioned in the design doc — the actual ``pip
        # install --require-hashes`` step is intentionally not
        # executed (it would re-download the entire tree for
        # little extra safety beyond the compile + hash step).
        run: |
          set -e
          pip-compile \
              --quiet \
              --generate-hashes \
              --output-file=requirements-hashed.txt \
              --extra=dev \
              --extra=anthropic \
              -- \
              pyproject.toml
          # Verify every package got a hash. ``pip-compile``
          # would fail on its own if any package were unhashable
          # — this ``grep`` is a belt-and-braces assertion in
          # case ``pip-compile`` softens the contract later.
          HASH_COUNT=$(grep -c -- "--hash=sha256:" requirements-hashed.txt || true)
          PKG_COUNT=$(grep -c -E "^[a-zA-Z0-9._-]+==" requirements-hashed.txt || true)
          echo "Pinned $PKG_COUNT packages with $HASH_COUNT hashes."
          test "$HASH_COUNT" -ge "$PKG_COUNT" \
              || (echo "Hash-pin audit failed: $HASH_COUNT hashes for $PKG_COUNT packages." && exit 1)
          echo "Hash-pin audit passed."

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            license-report.txt
            requirements-hashed.txt
          retention-days: 30