name: "OpenSSF Scorecard"

# Weekly security audit that posts a 0-10 score to the repo and
# uploads the SARIF results to the Security tab. Catches weak
# spots that dependabot / codeql don't cover: branch protection,
# dangerous workflow patterns, pinned action versions, etc.
#
# Run on the weekly cron + every push to main so the badge stays
# fresh. Read-only — no PRs opened, just a status check.

on:
  push:
    branches: [main, master]
  schedule:
    # Mondays 10:00 UTC. Picked to land ~1 hour after Dependabot
    # so the audit catches any newly-disclosed vulnerabilities
    # once a week.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  # Scorecard writes the SARIF results to the Security tab.
  security-events: write
  contents: read
  actions: read
  # Token permission needed for Scorecard to inspect branch
  # protection rules.
  pull-requests: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        # ``ossf/scorecard-action@v2.4.0`` defaults to a gcr.io
        # image that requires a billed Google Cloud project
        # on the runner. v2.4.4+ re-bases the image on
        # ``ghcr.io/ossf/scorecard-action`` (no billing needed).
        # Pin the latest release of the v2.4 line.
        uses: ossf/scorecard-action@v2.4.4
        with:
          # Publish to the repo's security tab so findings show
          # up alongside CodeQL alerts.
          results_file: results.sarif
          results_format: sarif
          # Publish a 0-10 score badge to the workflow run page.
          publish_results: true
        # PAT required for Scorecard to read branch-protection
        # and token-permission settings that the default
        # ``GITHUB_TOKEN`` can't see.
        env:
          GITHUB_TOKEN: ${{ secrets.SCORE_CARD_GITHUB_TOKEN }}

      - name: Upload SARIF results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard