name: "OpenSSF Scorecard"

# Weekly security audit that posts a 0-10 score to the repo and
# uploads the SARIF results to the Security tab. Catches weak
# spots that dependabot / codeql don't cover: branch protection,
# dangerous workflow patterns, pinned action versions, etc.
#
# Run on the weekly cron + every push to main so the badge stays
# fresh. Read-only — no PRs opened, just a status check.

on:
  push:
    branches: [main, master]
  schedule:
    # Mondays 10:00 UTC. Picked to land ~1 hour after Dependabot
    # so the audit catches any newly-disclosed vulnerabilities
    # once a week.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  # Scorecard writes the SARIF results to the Security tab.
  security-events: write
  contents: read
  actions: read
  # Token permission needed for Scorecard to inspect branch
  # protection rules.
  pull-requests: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        # The ossf/scorecard-action image is published on both
        # gcr.io and ghcr.io. gcr.io requires billing to be
        # enabled on a Google Cloud project for Docker pulls, but
        # the Scorecard action's source-of-truth is on
        # GitHub Container Registry — pin there to avoid the
        # unrelated gcr.io billing requirement.
        uses: ossf/scorecard-action@v2.4.0
        with:
          # Same as ``action.yaml`` upstream — used to override the
          # default ``gcr.io/ossf/scorecard-action:v2.4.0`` reference
          # when no Google Cloud billing account is linked to the
          # workflow's runner.
          image_name: ghcr.io/ossf/scorecard-action:v2.4.0
          # Publish to the repo's security tab so findings show
          # up alongside CodeQL alerts.
          results_file: results.sarif
          results_format: sarif
          # Publish a 0-10 score badge to the workflow run page
          # and (if the workflow has the
          # ``repo-public`` token permission) to the public badge
          # endpoint.
          publish_results: true
        # PAT required for Scorecard to read branch-protection
        # and token-permission settings that the default
        # ``GITHUB_TOKEN`` can't see.
        env:
          GITHUB_TOKEN: ${{ secrets.SCORE_CARD_GITHUB_TOKEN }}

      - name: Upload SARIF results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard