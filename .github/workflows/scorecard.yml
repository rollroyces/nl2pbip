name: "OpenSSF Scorecard (manual)"

# OpenSSF Scorecard audit. Posts a 0-10 score to the Security tab
# + the workflow run page, and uploads the SARIF results.
#
# Runs ONLY on workflow_dispatch (manual) because Scorecard's
# full check set requires a PAT (``SCORE_CARD_GITHUB_TOKEN``)
# to inspect branch-protection rules + token-permission
# settings the default ``GITHUB_TOKEN`` can't see. Without the
# PAT, Scorecard runs for ~15 minutes and times out. Once the
# PAT is provisioned, schedule a weekly run by editing the
# ``on:`` block below.
#
# Setup:
#   1. Create a PAT with ``repo`` + ``admin:org:read`` scope
#      at https://github.com/settings/tokens (classic).
#   2. Add it as a repo secret named ``SCORE_CARD_GITHUB_TOKEN``
#      at https://github.com/rollroyces/nl2pbip/settings/secrets/actions.
#   3. Trigger this workflow from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      publish_score:
        description: "Publish the score to the public badge"
        type: boolean
        default: false

permissions:
  # Scorecard writes the SARIF results to the Security tab.
  security-events: write
  contents: read
  actions: read
  pull-requests: read

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        # v2.4.4+ uses ghcr.io (no Google Cloud billing required).
        # Older v2.4.x pulled from gcr.io which fails on GitHub-
        # hosted runners because the runner's GCloud project
        # doesn't have billing enabled.
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event.inputs.publish_score }}
        env:
          # PAT required for Scorecard to read branch-protection
          # and token-permission settings that the default
          # ``GITHUB_TOKEN`` can't see. Empty value triggers a
          # graceful failure — see the workflow run logs.
          GITHUB_TOKEN: ${{ secrets.SCORE_CARD_GITHUB_TOKEN }}

      - name: Upload SARIF results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard