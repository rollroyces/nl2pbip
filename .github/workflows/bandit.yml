name: "Bandit Python security linter"

# Bandit scans the nl2pbip/ source tree for Python-specific
# security issues that CodeQL doesn't catch:
#
#   - B101 ``assert`` used for input validation (stripped by
#     ``python -O``).
#   - B102 ``exec`` / B602 ``shell=True``.
#   - B105 / B106 hard-coded passwords.
#   - B110 bare ``except: pass``.
#   - B311 ``random`` for crypto.
#   - B404 / B602 / B603 / B607 subprocess issues.
#   - B615 / B501 unsafe Hugging Face Hub downloads.
#   - B201-B204 pickle / marshal / eval.
#   - B301-B304 deserialisation issues.
#
# Runs on every PR + push to main. **Reports** issues as
# annotations (don't fail the build) because the codebase has
# ~6 known issues that are documented as ``# nosec`` candidates
# (mostly the finetune stack + the pbi-tools subprocess wrapper).
# Promoting to a gating check is the next step after each
# nosec'd line is reviewed.
#
# Setup: pure Python, no PAT needed. The workflow installs
# bandit in the CI venv alongside the dev extras.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "nl2pbip/**/*.py"
      - ".github/workflows/bandit.yml"
      - ".github/scripts/bandit_to_sarif.py"
      - ".bandit"
  push:
    branches: [main, master]
    paths:
      - "nl2pbip/**/*.py"
      - ".github/workflows/bandit.yml"
      - ".github/scripts/bandit_to_sarif.py"
      - ".bandit"

permissions:
  contents: read
  # ``security-events: write`` lets us upload the SARIF to the
  # Security tab so findings show up alongside CodeQL.
  security-events: write

jobs:
  bandit:
    name: Bandit scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install nl2pbip + bandit
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          pip-extras: "bandit"

      - name: Run Bandit
        # ``--ini`` reads the repo-level config so per-file
        # ``# nosec`` markers + per-test skips take effect. The
        # config file (``.bandit``) excludes the finetune stack
        # (it has subprocess / pickle patterns that are
        # expected for that subpackage) and the
        # test_prompt_polisher.py file (it intentionally uses
        # ``_fake()`` + ``FAKEPLACEHOLDER`` to exercise the
        # scrubber's regexes; bandit would flag them as
        # hard-coded secrets).
        #
        # Bandit 1.9 doesn't emit SARIF natively (format
        # choices are csv/custom/html/json/screen/txt/xml/yaml).
        # Convert JSON -> SARIF with the small
        # ``bandit_to_sarif.py`` helper in ``.github/scripts/``
        # so findings land in the Security tab.
        run: |
          set +e
          bandit \
              --ini .bandit \
              --recursive nl2pbip \
              --format json \
              --output bandit-results.json
          EXIT=$?
          echo "bandit exit: $EXIT"
          python .github/scripts/bandit_to_sarif.py
          # Gating mode: as of v1.3.1, the codebase is Bandit-clean
          # (5 known-justified findings carry ``# nosec`` markers).
          # Any new finding fails the build. To add a new
          # exception, prefer fixing the underlying code; only
          # add a ``# nosec <id> — <reason>`` marker when the
          # finding is genuinely a false positive (and the
          # reason must be multi-line so a code review catches
          # a casual ``# nosec`` sweep).
          exit $EXIT
        # Reporting mode + SARIF upload. ``continue-on-error`` on
        # the upload step below means a missing SARIF file
        # doesn't break the build (Bandit exits non-zero on
        # findings, the upload step runs anyway via ``if: always()``).

      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Post PR summary
        if: github.event_name == 'pull_request' && always()
        # The summary appears on the workflow run page; we
        # don't post a PR comment (Bandit's report is for the
        # maintainer, not a public "this is a warning" notice).
        run: |
          set +e
          if [[ -s bandit-results.sarif ]]; then
              COUNT=$(python -c "
              import json, sys
              data = json.load(open('bandit-results.sarif'))
              runs = data.get('runs', [])
              total = 0
              for run in runs:
                  total += len(run.get('results', []))
              print(total)
              ")
              {
                  echo "## Bandit"
                  echo ""
                  echo "**Findings:** $COUNT"
                  echo ""
                  echo "See SARIF artifact and the Security tab for the full report."
              } >> "$GITHUB_STEP_SUMMARY"
          else
              echo "No SARIF produced (bandit likely found no issues)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-log
          path: bandit-results.sarif
          retention-days: 14