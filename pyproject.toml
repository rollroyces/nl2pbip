[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2pbip"
version = "1.0.0"
description = "Natural Language to Power BI Project generator"
readme = "README.md"
requires-python = ">=3.10"
# Proprietary commercial license — see LICENSE. Use of this software
# without a signed Commercial License Agreement with the Licensor
# (Royce <rollroyces@users.noreply.github.com>) is not authorised.
# We do not declare license = "..." here because the Software is not
# released under any OSI-approved license; classifiers below reflect
# this and use the "Other/Proprietary License" bucket.
authors = [
  { name = "Royce", email = "rollroyces@users.noreply.github.com" }
]
keywords = ["power-bi", "pbip", "llm", "analytics", "dax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "jsonschema>=4.19",
  "openai>=1.20",
  "requests>=2.31"
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.26"
]
finetune = [
  "datasets>=2.19",
  "transformers>=4.38",
  "trl>=0.9",
  "unsloth>=2024.7.0",
  "instructor>=1.3",
  "pydantic>=2.6"
]
dev = [
  "black>=24.3",
  "ruff>=0.5",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "build>=1.2"
]

[project.scripts]
nl2pbip = "nl2pbip.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nl2pbip*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"nl2pbip" = [
  "dax_library.json",
  "py.typed",
]
