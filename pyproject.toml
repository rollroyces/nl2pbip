[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2pbip"
version = "1.4.0"
description = "Natural Language to Power BI Project generator"
readme = "README.md"
requires-python = ">=3.10"
# Proprietary commercial license — see LICENSE. Use of this software
# without a signed Commercial License Agreement with the Licensor
# (Royce <roycelam@umich.edu>) is not authorised.
# We do not declare license = "..." here because the Software is not
# released under any OSI-approved license; classifiers below reflect
# this and use the "Other/Proprietary License" bucket.
authors = [
  { name = "Royce", email = "roycelam@umich.edu" }
]
keywords = ["power-bi", "pbip", "llm", "analytics", "dax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "jsonschema>=4.19",
  "openai>=1.20",
  "requests>=2.31"
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.26"
]
finetune = [
  "datasets>=2.19",
  "transformers>=4.38",
  "trl>=0.9",
  "unsloth>=2024.7.0",
  "instructor>=1.3",
  "pydantic>=2.6"
]
dev = [
  "black>=24.3",
  "ruff>=0.5",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pyyaml>=6.0",
  "build>=1.2",
  "twine>=5.0",
  "vulture>=2.16",
  "pip-licenses>=5.0",
  "mypy>=1.10",
  "types-jsonschema",
  "types-PyYAML",
  "types-requests",
  "types-tabulate",
]

[project.scripts]
nl2pbip = "nl2pbip.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nl2pbip*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"nl2pbip" = [
  "dax_library.json",
  "py.typed",
]


[tool.mypy]
# Strict type-check settings. The codebase aims for zero
# errors in CI; see .github/workflows/mypy.yml for the
# report-only workflow that surfaces progress without
# gating PRs until the long-tail error count is zero.
python_version = "3.10"
strict = true
strict_equality = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# Heavy ML deps (unsloth / trl / datasets / instructor)
# don't ship py.typed markers, so they're effectively
# untyped. Excluding these modules lets mypy --strict
# pass on the rest of the codebase.
module = [
  "nl2pbip.finetune.*",
  "nl2pbip.providers.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
# LLM provider SDKs are optional dependencies (the
# ``openai`` and ``anthropic`` extras). They ship
# stubs but mypy ignores missing imports by default.
module = ["openai", "anthropic"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``jsonschema`` doesn't ship a py.typed marker in all release
# channels. ``types-jsonschema`` provides a stub but the runtime
# dep is enough for our narrow usage (Draft7Validator + the
# ValidationError exception). Skip import resolution so mypy
# doesn't gate on whether the stub is installed.
module = ["jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``tiktoken`` ships with the ``openai`` runtime dep but
# doesn't always expose a discoverable ``py.typed`` marker
# (depends on install path / pip resolver behaviour). Guard
# against CI's import-not-found noise so a missing stub on
# one machine doesn't gate the whole mypy run.
module = ["tiktoken"]
ignore_missing_imports = true
